<div class="os-shell" id="os-shell">
  <header id="navbar-slot" class="navbar-region"></header>
  <aside id="sidebar-slot" class="sidebar-region"></aside>
  <main class="main-region" id="main-region">
    <header class="page-header">
      <div>
        <div class="breadcrumb">DARK BOOK OS <span>/</span> <span id="page-breadcrumb">DASHBOARD</span></div>
        <h1 id="page-title">Dashboard</h1>
        <p id="page-description">Estado operativo del cerebro artificial.</p>
      </div>
      <div id="page-actions" class="page-actions"></div>
    </header>
    <section id="page-content" class="page-content" aria-live="polite"></section>
  </main>
  <aside id="intelligence-panel" class="intelligence-panel" aria-label="Panel inteligente">
    <div class="panel-title"><span>INTELLIGENCE PULSE</span><strong id="panel-clock">00:00</strong></div>
    <div class="neural-orbit" aria-hidden="true"><i></i><i></i><i></i><b>AI</b></div>
    <div class="panel-state"><span>NEURAL CORE</span><strong id="panel-ai-state">SINCRONIZANDO</strong></div>
    <div class="micro-metrics">
      <div><span>Memoria</span><strong id="panel-memory">—</strong></div>
      <div><span>Videos</span><strong id="panel-videos">—</strong></div>
      <div><span>Ciclos</span><strong id="panel-cycles">—</strong></div>
    </div>
    <div class="panel-section">
      <h2>Actividad neural</h2>
      <div id="panel-events" class="panel-events"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    </div>
    <div class="panel-section panel-health">
      <h2>Salud del sistema</h2>
      <div class="health-row"><span>CPU</span><div class="progress-track"><i id="panel-cpu"></i></div><b id="panel-cpu-label">—</b></div>
      <div class="health-row"><span>RAM</span><div class="progress-track"><i id="panel-ram"></i></div><b id="panel-ram-label">—</b></div>
      <div class="health-row"><span>DISK</span><div class="progress-track"><i id="panel-disk"></i></div><b id="panel-disk-label">—</b></div>
    </div>
  </aside>
  <footer id="footer-slot" class="footer-region"></footer>
</div>
<div id="overlay-root"></div>
